name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        run: xmake f -p windows -a x64 -m release -y

      - name: Build
        run: xmake -y -v

      - name: Package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse build -Filter WerewolfHotkey.dll | Select-Object -First 1
          if (-not $dll) { throw "DLL not found" }
          New-Item -ItemType Directory -Force dist/Data/SKSE/Plugins | Out-Null
          Copy-Item $dll.FullName dist/Data/SKSE/Plugins/
          Copy-Item WerewolfHotkey.ini dist/Data/SKSE/Plugins/

      - uses: actions/upload-artifact@v4
        with:
          name: WerewolfHotkey
          path: dist
