; WerewolfHotkey settings
; Hotkey is a DirectInput scan code (decimal or 0x hex). K = 0x25 (37).
; Table: https://www.creationkit.com/index.php?title=Input_Script#DXScanCodes

[General]
Hotkey=0x25

; 1 = pressing the key in werewolf form reverts (needs RevertSpell), 0 = transform only
ToggleBack=1

; FormIDs from Skyrim.esm (load order index 00). VERIFY in SSEEdit!
TransformSpell=0x92C48
WerewolfRace=0xCDD84

; 0 = revert disabled. Put the FormID of the revert spell here once you find it in SSEEdit.
RevertSpell=0x0
